name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Docker is available on GitHub runners, so the Testcontainers tests (*IT) run here too
      - run: mvn -B verify
      - name: Build image
        run: docker build -t ${{ github.event.repository.name }}:${{ github.sha }} .
